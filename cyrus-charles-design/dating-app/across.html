<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#161310">
  <title>Across</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..650;1,6..72,450..600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --room: #161310;
      --paper: #F6F0E6;
      --ink: #1A1612;
      --pen: #9C3B2E;
      --their: #1F4A40;
      --muted: #6F6258;
      --line: #E4D9CC;
      --faint: #B7A89A;
      --sans: "Outfit", system-ui, sans-serif;
      --serif: "Newsreader", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    button, textarea { font: inherit; color: inherit; }
    p, h2, ul { margin: 0; }
    button { cursor: pointer; }
    ::selection { background: #F0D2C4; }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse 70% 46% at 50% 38%, rgba(255, 186, 110, 0.09), transparent 62%),
        var(--room);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
    }

    .topbar {
      width: min(640px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      color: var(--paper);
    }

    .brand {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
    }

    .kept-btn {
      display: inline-flex;
      align-items: center;
      background: transparent;
      color: var(--paper);
      border: 1px solid rgba(246, 240, 230, 0.28);
      border-radius: 999px;
      padding: 8px 12px 8px 14px;
      font-size: 0.92rem;
      font-weight: 500;
    }

    .kept-btn:hover { border-color: rgba(246, 240, 230, 0.55); }

    #keptCount {
      display: inline-grid;
      place-items: center;
      min-width: 1.35rem;
      height: 1.35rem;
      margin-left: 8px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(246, 240, 230, 0.12);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    #keptCount[hidden] { display: none; }
    .kept-btn.has #keptCount { background: var(--pen); color: white; }

    main { width: min(640px, 100%); }

    .paper {
      position: relative;
      min-height: 640px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.45), transparent 90px),
        var(--paper);
      color: var(--ink);
      padding: 36px 40px 22px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.55) inset,
        0 30px 70px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
    }

    .sheet {
      flex: 1;
      display: flex;
      flex-direction: column;
      animation: rise 0.45s ease;
    }

    .sheet.is-empty { justify-content: center; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .tableno {
      margin-top: 28px;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 600;
    }

    .kicker {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .who {
      display: flex;
      gap: 14px;
      align-items: center;
      margin: 14px 0 28px;
    }

    .who h2 {
      font-family: var(--serif);
      font-size: 1.55rem;
      font-weight: 550;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .who p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--av, #E7D3C0);
      position: relative;
      overflow: hidden;
      flex: none;
    }

    .avatar span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.35rem;
    }

    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .plan {
      font-family: var(--serif);
      font-weight: 450;
      font-size: clamp(1.35rem, 2.5vw, 1.8rem);
      line-height: 1.45;
      letter-spacing: -0.02em;
      text-wrap: pretty;
    }

    .blank {
      color: var(--pen);
      font-style: italic;
      caret-color: var(--pen);
      border-bottom: 1.5px solid currentColor;
      padding: 0 2px 1px;
      outline: none;
      overflow-wrap: anywhere;
    }

    .glue:has(.is-empty) { white-space: nowrap; }

    .plan .blank.is-empty {
      display: inline-block;
      min-width: 8.25rem;
      margin: 0 0.08em;
      background: transparent;
      border-bottom-color: var(--ink);
      vertical-align: baseline;
    }

    .paper.is-stamped .who { padding-right: 78px; }

    .yours { font-style: italic; color: var(--pen); font-weight: 520; }
    .theirs { font-style: italic; color: var(--their); font-weight: 520; }

    .hint {
      margin-top: 22px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hint.is-warn { color: var(--pen); }

    .asked { margin-top: 26px; }

    .question {
      font-family: var(--serif);
      font-size: 1.22rem;
      line-height: 1.35;
      margin: 8px 0 2px;
    }

    textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      font-family: var(--serif);
      font-size: 1.12rem;
      line-height: 1.4;
      padding: 8px 0;
      resize: none;
      border-radius: 0;
      color: var(--ink);
    }

    textarea::placeholder {
      color: var(--faint);
      font-style: italic;
    }

    textarea:focus {
      outline: none;
      border-bottom-color: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 18px;
      margin-top: 12px;
    }

    #leaveSlot { margin-right: auto; }

    .leave {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .btn-ink {
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .btn-ink:hover:not(:disabled) { transform: translateY(-1px); }

    .btn-ink:disabled {
      background: #E4DDD4;
      color: #6A6158;
      cursor: default;
    }

    .btn-quiet {
      background: none;
      border: none;
      color: var(--muted);
      padding: 10px 2px;
      font-size: 0.95rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .btn-quiet:hover { color: var(--ink); }
    .btn-quiet.danger { color: var(--pen); }

    .quiet-plan {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .plan-quiet {
      font-size: 1.15rem;
      color: #4E453E;
      margin-top: 8px;
    }

    .unfilled {
      display: inline-block;
      width: 6.5rem;
      border-bottom: 1.5px solid var(--faint);
      transform: translateY(-3px);
      margin: 0 0.15em;
    }

    .reply {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.18rem;
      line-height: 1.4;
      margin-top: 14px;
      color: #3A312B;
    }

    .answer-show {
      font-family: var(--serif);
      font-size: 1.12rem;
      line-height: 1.4;
      margin-top: 8px;
    }

    .status-line {
      margin-top: 18px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dots { display: inline-flex; gap: 3px; }
    .dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.25;
      animation: blink 1.1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }

    @keyframes blink {
      0%, 70%, 100% { opacity: 0.25; }
      35% { opacity: 1; }
    }

    .stamp {
      position: absolute;
      top: 22px;
      right: 22px;
      width: 74px;
      height: 74px;
      border: 2px solid var(--pen);
      color: var(--pen);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transform: rotate(-14deg) scale(1.35);
      opacity: 0;
      animation: stamp 0.4s cubic-bezier(0.2, 1.3, 0.4, 1) forwards;
      pointer-events: none;
    }

    @keyframes stamp {
      to { opacity: 0.9; transform: rotate(-8deg) scale(1); }
    }

    .chair {
      width: 68px;
      height: 58px;
      color: var(--ink);
      margin-bottom: 14px;
    }

    .empty-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(1.7rem, 3vw, 2.2rem);
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .lede {
      margin-top: 10px;
      max-width: 36rem;
      font-size: 1.02rem;
      line-height: 1.45;
      color: #3A312B;
    }

    .sheet.is-empty .actions { margin-top: 20px; }

    .slip {
      margin-top: 26px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      max-width: 36rem;
    }

    .rows { margin-top: 18px; }

    .row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }

    .rows .row:last-child { border-bottom: 1px solid var(--line); }
    .row:hover .excerpt { color: var(--pen); }

    .excerpt {
      font-family: var(--serif);
      font-size: 1.08rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .recap {
      list-style: none;
      padding: 0;
      margin: 8px 0 0;
    }

    .recap .row { padding: 12px 0; }

    button:focus-visible {
      outline: 2px solid #F3EBDF;
      outline-offset: 3px;
    }

    .paper button:focus-visible { outline-color: var(--pen); }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      body { padding: 16px 12px 32px; }
      .paper {
        min-height: 0;
        padding: 26px 18px 16px;
      }
      .who h2 { font-size: 1.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sheet { animation: none; }
      .stamp { animation: none; opacity: 0.9; transform: rotate(-8deg); }
      .dots i { animation: none; opacity: 1; }
      .btn-ink:hover:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Across</div>
    <button type="button" class="kept-btn" id="keptBtn" aria-expanded="false">
      <span id="keptLabel">Kept</span>
      <span id="keptCount">0</span>
    </button>
  </header>

  <main>
    <article class="paper" id="paper">
      <div class="sheet" id="sheet"></div>
      <p class="tableno">Table 2</p>
    </article>
  </main>
  <p id="status" class="sr" aria-live="polite"></p>

  <script>
    const yourPlan = {
      before: "A weeknight where we ",
      after: ", and nobody checks the time until it’s already late.",
    };

    const seats = [
      {
        id: "noor",
        evening: "Wednesday",
        name: "Noor El-Sayed",
        age: 31,
        note: "Makes prints. Walks farther than she means to.",
        initial: "N",
        ink: "#E7D3C0",
        photo: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=240&h=240&q=80",
        before: "Sunday, if it isn’t raining. We walk the length of ",
        after: " and only talk about things we can point at.",
        reply: "I’ll stop too long at the ordinary parts. You can pull me along.",
        ask: "What do you notice that other people edit out?",
        finishes: "walk until our own street looks unfamiliar",
      },
      {
        id: "samir",
        evening: "Thursday",
        name: "Samir Adeyemi",
        age: 29,
        note: "Cooks after the restaurant has closed.",
        initial: "S",
        ink: "#E4CDB3",
        photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=240&h=240&q=80",
        before: "Thursday, after my shift. I cook you ",
        after: ", and you tell me if it tastes like the place it’s from.",
        reply: "If I can’t cook it, we go find the person who can.",
        ask: "What did you eat the last time you were happy for no reason?",
        finishes: "eat standing up, out of the pan",
      },
      {
        id: "june",
        evening: "Friday",
        name: "June Park",
        age: 34,
        note: "Teaches high-school orchestra. Protects her evenings.",
        initial: "J",
        ink: "#E8D7C6",
        photo: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=240&h=240&q=80",
        before: "Friday, early. We get to ",
        after: " before anyone else, and we leave while the evening still has something left.",
        reply: "I’ll be there before it fills up. Leaving on time is how I stay glad I came.",
        ask: "What are you protective of that isn’t a person?",
        finishes: "play one record without talking over it",
      },
    ];

    const chair = `
      <svg class="chair" viewBox="0 0 72 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 8v48"/>
        <path d="M22 30h28v26"/>
        <path d="M16 56h42"/>
      </svg>`;

    let index = 0;
    let phase = "seated";
    let kept = [];
    let draft = { fill: "", answer: "", leaving: false };
    let leftHow = "";
    let freshKeep = null;
    let returnPhase = "seated";
    let readingAt = 0;
    let pendingFocus = true;
    let timer = 0;

    const paper = document.getElementById("paper");
    const sheet = document.getElementById("sheet");
    const keptBtn = document.getElementById("keptBtn");

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[c]));
    }

    function first(name) {
      return name.split(" ")[0];
    }

    function reduceMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function arm(fn, ms) {
      clearTimeout(timer);
      timer = setTimeout(fn, ms);
    }

    function filled(before, fill, after, cls) {
      return `${esc(before)}<em class="${cls}">${esc(fill)}</em>${esc(after)}`;
    }

    function personHead(p) {
      return `
        <p class="kicker">${esc(p.evening)} evening</p>
        <div class="who">
          <div class="avatar" style="--av:${esc(p.ink)}">
            <span>${esc(p.initial)}</span>
            <img src="${esc(p.photo)}" alt="">
          </div>
          <div>
            <h2>${esc(p.name)}</h2>
            <p>${esc(p.age)} · ${esc(p.note)}</p>
          </div>
        </div>`;
    }

    function gapHTML(before, after) {
      const trimmed = before.replace(/\s+$/, "");
      const split = trimmed.lastIndexOf(" ");
      const head = split < 0 ? "" : trimmed.slice(0, split + 1);
      const tail = split < 0 ? trimmed : trimmed.slice(split + 1);
      return `${esc(head)}<span class="glue">${esc(tail)} <span id="blank" class="blank is-empty" contenteditable="true" role="textbox" spellcheck="false" enterkeyhint="done" aria-label="The missing part of the plan" aria-describedby="hint"></span></span>${esc(after)}`;
    }

    function leaveHTML() {
      if (!draft.leaving) {
        return `<button type="button" class="btn-quiet" data-act="leave">Give up this chair</button>`;
      }
      return `
        <div class="leave">
          <span>Leave this evening unfinished?</span>
          <button type="button" class="btn-quiet danger" data-act="confirm-leave">Leave</button>
          <button type="button" class="btn-quiet" data-act="stay">Stay</button>
        </div>`;
    }

    function viewSeated() {
      const p = seats[index];
      return `
        ${personHead(p)}
        <p class="kicker">They started this</p>
        <p class="plan">${gapHTML(p.before, p.after)}</p>
        <div class="asked">
          <p class="kicker">Asked of you</p>
          <p class="question">${esc(p.ask)}</p>
          <textarea id="answer" rows="2" maxlength="180" placeholder="Answer, if you want" aria-label="Your answer. Optional."></textarea>
        </div>
        <p class="hint" id="hint">Write the gap, then sit down.</p>
        <div class="actions">
          <div id="leaveSlot">${leaveHTML()}</div>
          <button type="button" class="btn-ink" id="sit" data-act="sit" disabled>Sit down</button>
        </div>
        <div class="quiet-plan">
          <p class="kicker">Yours, if they sit too</p>
          <p class="plan plan-quiet">${esc(yourPlan.before)}<span class="unfilled" aria-hidden="true"></span>${esc(yourPlan.after)}</p>
        </div>`;
    }

    function viewWaiting() {
      const p = seats[index];
      return `
        ${personHead(p)}
        <p class="kicker">They started this</p>
        <p class="plan">${filled(p.before, draft.fill, p.after, "yours")}</p>
        <p class="status-line">${esc(first(p.name))} is writing back<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>`;
    }

    function viewDeciding() {
      const p = seats[index];
      const stamp = phase === "stamping" ? `<div class="stamp">Kept</div>` : "";
      const answer = draft.answer
        ? `<div class="quiet-plan"><p class="kicker">You answered</p><p class="answer-show">${esc(draft.answer)}</p></div>`
        : "";
      const actions = phase === "deciding"
        ? `<div class="actions">
            <button type="button" class="btn-ink" data-act="keep">Keep this table</button>
            <button type="button" class="btn-quiet" data-act="stand">Stand up</button>
          </div>`
        : "";
      return `
        ${stamp}
        ${personHead(p)}
        <p class="kicker">The plan, finished</p>
        <p class="plan">${filled(p.before, draft.fill, p.after, "yours")}</p>
        <p class="reply">— ${esc(p.reply)}</p>
        ${answer}
        <div class="quiet-plan">
          <p class="kicker">They finished yours</p>
          <p class="plan plan-quiet">${filled(yourPlan.before, p.finishes, yourPlan.after, "theirs")}</p>
        </div>
        ${actions}`;
    }

    function viewEmpty() {
      const p = seats[index];
      const next = seats[index + 1];
      const who = first(p.name);
      let lead = `You let ${who}’s chair stay empty.`;
      if (leftHow === "kept") lead = `You kept ${p.evening} with ${who}.`;
      if (leftHow === "stood") lead = `You and ${who} left it there.`;
      const nextLine = next
        ? `${next.evening} evening, someone sits down.`
        : "That was the last chair this week.";
      const label = next ? `Let ${p.evening} pass` : "Leave the table";
      const slip = leftHow === "kept" && freshKeep
        ? `<div class="slip"><p class="kicker">The plan</p><p class="plan plan-quiet">${filled(freshKeep.before, freshKeep.fill, freshKeep.after, "yours")}</p></div>`
        : "";
      return `
        ${chair}
        <h2 class="empty-title">The other chair is empty.</h2>
        <p class="lede">${esc(lead)} ${esc(nextLine)}</p>
        <div class="actions">
          <button type="button" class="btn-ink" data-act="pass">${esc(label)}</button>
        </div>
        ${slip}`;
    }

    function viewOver() {
      const n = kept.length;
      const lede = n === 0
        ? "Three evenings. You didn’t keep a table."
        : "Three evenings at this table.";
      const rows = kept.map((k, i) => `
        <button type="button" class="row" data-act="read" data-i="${i}">
          <span class="kicker">${esc(k.evening)} · ${esc(first(k.name))}</span>
          <span class="excerpt">${esc(k.before + k.fill + k.after)}</span>
        </button>`).join("");
      return `
        <p class="kicker">This week</p>
        <h2 class="empty-title">The week is over.</h2>
        <p class="lede">${lede}</p>
        ${n ? `<div class="rows recap">${rows}</div>` : ""}
        <div class="actions">
          <button type="button" class="btn-quiet" data-act="replay">Run the week again</button>
        </div>`;
    }

    function viewArchive() {
      if (!kept.length) {
        return `
          <p class="kicker">Kept</p>
          <h2 class="empty-title">No tables kept.</h2>
          <p class="lede">A table stays here only after both of you have written in it.</p>`;
      }
      const rows = kept.map((k, i) => `
        <button type="button" class="row" data-act="read" data-i="${i}">
          <span class="kicker">${esc(k.evening)} · ${esc(first(k.name))}</span>
          <span class="excerpt">${esc(k.before + k.fill + k.after)}</span>
        </button>`).join("");
      return `
        <p class="kicker">Kept</p>
        <h2 class="empty-title">Tables you held.</h2>
        <div class="rows">${rows}</div>`;
    }

    function viewReading() {
      const k = kept[readingAt];
      const answer = k.answer
        ? `<div class="quiet-plan"><p class="kicker">You answered</p><p class="answer-show">${esc(k.answer)}</p></div>`
        : "";
      return `
        <p class="kicker">Kept · ${esc(k.evening)}</p>
        <h2 class="empty-title">${esc(first(k.name))}</h2>
        <p class="plan" style="margin-top:16px">${filled(k.before, k.fill, k.after, "yours")}</p>
        <p class="reply">— ${esc(k.reply)}</p>
        ${answer}
        <div class="quiet-plan">
          <p class="kicker">They finished yours</p>
          <p class="plan plan-quiet">${filled(yourPlan.before, k.finishes, yourPlan.after, "theirs")}</p>
        </div>
        <div class="actions">
          <button type="button" class="btn-quiet" data-act="back-list">All kept tables</button>
        </div>`;
    }

    function view() {
      switch (phase) {
        case "seated": return viewSeated();
        case "waiting": return viewWaiting();
        case "deciding":
        case "stamping": return viewDeciding();
        case "empty": return viewEmpty();
        case "over": return viewOver();
        case "archive": return viewArchive();
        case "reading": return viewReading();
        default: return "";
      }
    }

    function announcement() {
      const p = seats[index];
      switch (phase) {
        case "seated":
          return `${p.name} is seated. Their plan has a gap only you can write.`;
        case "waiting":
          return `${first(p.name)} is writing back.`;
        case "deciding":
          return `${first(p.name)} wrote back. Keep the table, or stand up.`;
        case "stamping":
          return `You kept ${p.evening} with ${first(p.name)}.`;
        case "empty":
          return "The other chair is empty.";
        case "over":
          return `The week is over. You kept ${kept.length}.`;
        case "archive":
          return `Tables you kept: ${kept.length}.`;
        case "reading":
          return `Kept table with ${kept[readingAt].name}.`;
        default:
          return "";
      }
    }

    function render() {
      sheet.innerHTML = view();
      sheet.classList.toggle("is-empty", phase === "empty" || phase === "over");
      paper.classList.toggle("is-stamped", phase === "stamping");
      const back = phase === "archive" || phase === "reading";
      document.getElementById("keptLabel").textContent = back ? "Back to the table" : "Kept";
      const count = document.getElementById("keptCount");
      count.textContent = String(kept.length);
      count.hidden = back;
      keptBtn.classList.toggle("has", kept.length > 0 && !back);
      keptBtn.setAttribute("aria-expanded", back ? "true" : "false");
      const status = document.getElementById("status");
      status.textContent = "";
      requestAnimationFrame(() => { status.textContent = announcement(); });
      sheet.classList.remove("in");
      void sheet.offsetWidth;
      sheet.classList.add("in");
      bindSheet();
    }

    function syncBlank(el) {
      const raw = el.textContent.replace(/\u00a0/g, " ");
      el.classList.toggle("is-empty", raw.trim() === "");
      const btn = document.getElementById("sit");
      if (btn) btn.disabled = raw.trim().length < 2;
      const hint = document.getElementById("hint");
      if (hint && hint.classList.contains("is-warn") && raw.trim().length >= 2) {
        hint.classList.remove("is-warn");
        hint.textContent = "Write the gap, then sit down.";
      }
    }

    function placeCaretEnd(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function insertPlain(text) {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const node = document.createTextNode(text);
      range.insertNode(node);
      range.setStartAfter(node);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function bindBlank(el) {
      let lock = false;
      el.addEventListener("input", () => {
        if (lock) return;
        lock = true;
        if (el.children.length) {
          const t = el.textContent;
          el.textContent = t;
          placeCaretEnd(el);
        }
        if (el.textContent.length > 48) {
          el.textContent = el.textContent.slice(0, 48);
          placeCaretEnd(el);
        }
        lock = false;
        syncBlank(el);
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          act("sit");
        }
      });
      el.addEventListener("paste", (e) => {
        e.preventDefault();
        const text = (e.clipboardData.getData("text/plain") || "").replace(/\s+/g, " ");
        const room = 48 - el.textContent.length;
        if (room <= 0) return;
        insertPlain(text.slice(0, room));
        el.dispatchEvent(new Event("input", { bubbles: true }));
      });
      el.addEventListener("drop", (e) => e.preventDefault());
      syncBlank(el);
    }

    function bindSheet() {
      sheet.querySelectorAll("img").forEach((img) => {
        img.addEventListener("error", () => img.remove());
      });
      const blank = document.getElementById("blank");
      if (blank) bindBlank(blank);
      if (pendingFocus && blank) {
        blank.focus();
        pendingFocus = false;
      }
    }

    function readAnswer() {
      const answer = document.getElementById("answer");
      return answer ? answer.value.trim().slice(0, 180) : "";
    }

    function sit() {
      if (phase !== "seated") return;
      const blank = document.getElementById("blank");
      const fill = (blank ? blank.textContent : "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
      if (fill.length < 2) {
        const hint = document.getElementById("hint");
        hint.textContent = "Write a little more than that.";
        hint.classList.add("is-warn");
        if (blank) blank.focus();
        return;
      }
      draft.fill = fill.slice(0, 48);
      draft.answer = readAnswer();
      draft.leaving = false;
      if (reduceMotion()) {
        phase = "deciding";
        render();
        return;
      }
      phase = "waiting";
      render();
      arm(() => {
        if (phase !== "waiting") return;
        phase = "deciding";
        render();
      }, 900);
    }

    function toEmpty(how) {
      leftHow = how;
      if (how !== "kept") freshKeep = null;
      draft = { fill: "", answer: "", leaving: false };
      phase = "empty";
      render();
    }

    function keep() {
      if (phase !== "deciding") return;
      const p = seats[index];
      freshKeep = {
        id: p.id,
        evening: p.evening,
        name: p.name,
        before: p.before,
        after: p.after,
        fill: draft.fill,
        reply: p.reply,
        ask: p.ask,
        finishes: p.finishes,
        answer: draft.answer,
      };
      kept.push(freshKeep);
      phase = "stamping";
      render();
      arm(() => {
        if (phase !== "stamping") return;
        toEmpty("kept");
      }, reduceMotion() ? 500 : 900);
    }

    function passEvening() {
      if (phase !== "empty") return;
      freshKeep = null;
      index += 1;
      draft = { fill: "", answer: "", leaving: false };
      if (index >= seats.length) {
        phase = "over";
        render();
        return;
      }
      pendingFocus = true;
      phase = "seated";
      render();
    }

    function openArchive() {
      if (phase === "waiting" || phase === "stamping") return;
      if (phase !== "archive" && phase !== "reading") returnPhase = phase;
      phase = "archive";
      render();
    }

    function replay() {
      clearTimeout(timer);
      index = 0;
      kept = [];
      freshKeep = null;
      leftHow = "";
      draft = { fill: "", answer: "", leaving: false };
      returnPhase = "seated";
      pendingFocus = true;
      phase = "seated";
      render();
    }

    function act(name, btn) {
      if ((phase === "waiting" || phase === "stamping") && name !== "close") return;
      switch (name) {
        case "sit":
          sit();
          break;
        case "leave":
          draft.leaving = true;
          document.getElementById("leaveSlot").innerHTML = leaveHTML();
          break;
        case "stay":
          draft.leaving = false;
          document.getElementById("leaveSlot").innerHTML = leaveHTML();
          break;
        case "confirm-leave":
          toEmpty("gaveup");
          break;
        case "keep":
          keep();
          break;
        case "stand":
          toEmpty("stood");
          break;
        case "pass":
          passEvening();
          break;
        case "archive":
          openArchive();
          break;
        case "close":
          phase = returnPhase;
          render();
          break;
        case "read":
          if (phase !== "archive" && phase !== "reading") returnPhase = phase;
          readingAt = Number(btn.dataset.i);
          phase = "reading";
          render();
          break;
        case "back-list":
          phase = "archive";
          render();
          break;
        case "replay":
          replay();
          break;
        default:
          break;
      }
    }

    sheet.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn || !sheet.contains(btn)) return;
      act(btn.dataset.act, btn);
    });

    keptBtn.addEventListener("click", () => {
      if (phase === "archive" || phase === "reading") act("close");
      else act("archive");
    });

    render();
  </script>
</body>
</html>
