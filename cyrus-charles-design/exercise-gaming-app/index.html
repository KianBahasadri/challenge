<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191615">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Phone and computer demo frames for the exercise gaming app.">
  <title>Exercise gaming app — device demos</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #191615;
      --screen: #252120;
      --ink: #f0e5dc;
      font-family: Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100%, 1560px);
      min-height: 100svh;
      margin: auto;
      padding: 36px 48px 56px;
    }

    .devices {
      display: grid;
      grid-template-columns: 376px minmax(0, 1fr);
      align-items: center;
      gap: 64px;
      padding-top: 40px;
    }

    figure {
      min-width: 0;
      margin: 0;
    }

    .phone-preview {
      width: min(100%, 376px);
      justify-self: center;
    }

    .phone {
      position: relative;
      width: 100%;
      aspect-ratio: 376 / 784;
      padding: 9px;
      border: 1px solid #534b46;
      border-radius: 48px;
      background: #292524;
      box-shadow: 0 0 0 2px #6d625a, 0 0 0 4px #302b27,
        0 24px 70px -15px #0009;
    }

    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      width: 4px;
      background: #6d625a;
    }

    .phone::before {
      right: -5px;
      top: 169px;
      height: 65px;
      border-radius: 0 3px 3px 0;
    }

    .phone::after {
      left: -5px;
      top: 135px;
      height: 34px;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 47px #6d625a;
    }

    .phone-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border: 1px solid #141110;
      border-radius: 38px;
      background: var(--screen);
    }

    .statusbar {
      position: relative;
      display: flex;
      flex: 0 0 45px;
      align-items: center;
      justify-content: space-between;
      padding: 7px 24px 0;
      font-size: 11px;
      font-weight: 600;
    }

    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 100px;
      height: 25px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: #100e0d;
    }

    .island::after {
      content: "";
      position: absolute;
      top: 9px;
      right: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #202329;
      box-shadow: inset 0 0 0 2px #17191d;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-icons svg {
      display: block;
      width: 15px;
      height: 12px;
      fill: currentColor;
    }

    .status-icons .battery { width: 23px; }

    .app-viewport {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .home-area {
      display: grid;
      flex: 0 0 25px;
      place-items: center;
    }

    .home-indicator {
      width: 116px;
      height: 4px;
      border-radius: 4px;
      background: #d7ccc5;
    }

    .computer-preview {
      width: 100%;
      max-width: 960px;
      justify-self: center;
    }

    .computer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .monitor {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 23px 13px 18px;
      border: 1px solid #6d625a;
      border-radius: 20px;
      background: #292524;
      box-shadow: 0 0 0 2px #302b27, 0 24px 70px -15px #0009;
    }

    .monitor::before {
      content: "";
      position: absolute;
      top: 8px;
      left: calc(50% - 3px);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111112;
      box-shadow: inset 0 0 0 2px #1e2228;
    }

    .computer-screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid #141110;
      border-radius: 6px;
      background: var(--screen);
    }

    .taskbar {
      display: flex;
      flex: 0 0 42px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 12px;
      border-top: 1px solid #443a34;
      background: #1c1917;
      color: #d7ccc5;
    }

    .taskbar-apps,
    .system-tray {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .taskbar-app {
      display: grid;
      width: 28px;
      height: 30px;
      place-items: center;
    }

    .taskbar svg {
      display: block;
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .taskbar-launcher { color: #d6b6a4; }
    .taskbar-folder { color: #d5b275; }
    .taskbar-browser { color: #94b5c5; }
    .system-tray svg { width: 14px; height: 14px; }

    .taskbar-clock {
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .monitor-stand {
      width: 15%;
      aspect-ratio: 2 / 1;
      background: linear-gradient(#302925, #655b53);
      clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
    }

    .monitor-base {
      width: 34%;
      height: clamp(7px, 1vw, 12px);
      border: 1px solid #786b61;
      border-radius: 50% 50% 4px 4px;
      background: #5a5049;
      box-shadow: 0 12px 24px #0007;
    }

    @media (max-width: 1100px) {
      .devices {
        grid-template-columns: minmax(0, 1fr);
        gap: 60px;
      }
    }

    @media (max-width: 540px) {
      .page { padding: 24px 24px 40px; }
      .devices { padding-top: 30px; gap: 48px; }
      .monitor { padding: 18px 7px 10px; border-radius: 12px; }
      .monitor::before { top: 6px; }
      .computer-screen { border-radius: 3px; }
      .taskbar { flex-basis: 32px; gap: 8px; padding: 0 8px; }
      .taskbar-apps, .system-tray { gap: 8px; }
      .taskbar-app { width: 22px; height: 26px; }
      .taskbar-app svg { width: 16px; height: 16px; }
      .taskbar-clock { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="devices" aria-label="Device demos">
      <figure class="phone-preview" aria-label="Phone">
        <div class="phone">
          <div class="phone-screen">
            <div class="statusbar" aria-hidden="true">
              <span>9:41</span>
              <span class="island"></span>
              <div class="status-icons">
                <svg viewBox="0 0 18 14">
                  <rect x="0" y="10" width="3" height="4" rx=".5"/>
                  <rect x="5" y="7" width="3" height="7" rx=".5"/>
                  <rect x="10" y="4" width="3" height="10" rx=".5"/>
                  <rect x="15" y="1" width="3" height="13" rx=".5"/>
                </svg>
                <svg viewBox="0 0 20 15">
                  <path d="M1 4Q10-3 19 4l-2 2Q10 1 3 6Zm4 4q5-4 10 0l-2 2q-3-2-6 0Zm3 4q2-2 4 0l-2 3Z"/>
                </svg>
                <svg class="battery" viewBox="0 0 27 14">
                  <rect x="1" y="2" width="22" height="10" rx="2" fill="none" stroke="currentColor"/>
                  <rect x="3" y="4" width="17" height="6" rx="1"/>
                  <rect x="25" y="5" width="2" height="4" rx="1"/>
                </svg>
              </div>
            </div>
            <div class="app-viewport" id="phone-app">
              <!-- Phone app content goes here. -->
            </div>
            <div class="home-area" aria-hidden="true">
              <div class="home-indicator"></div>
            </div>
          </div>
        </div>
      </figure>

      <figure class="computer-preview" aria-label="Computer">
        <div class="computer">
          <div class="monitor">
            <div class="computer-screen">
              <div class="app-viewport" id="computer-app">
                <!-- Computer app content goes here. -->
              </div>
              <div class="taskbar" aria-hidden="true">
                <div class="taskbar-apps">
                  <span class="taskbar-app taskbar-launcher">
                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                      <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z" fill="currentColor" stroke="none"/>
                    </svg>
                  </span>
                  <span class="taskbar-app">
                    <svg viewBox="0 0 24 24">
                      <circle cx="10.5" cy="10.5" r="6.5"/>
                      <path d="m16 16 5 5"/>
                    </svg>
                  </span>
                  <span class="taskbar-app taskbar-folder">
                    <svg viewBox="0 0 24 24">
                      <path d="M3 7V5h6l2 2h10v12H3Z" fill="currentColor" stroke="none" opacity=".65"/>
                      <path d="M3 10h18v9H3Z" fill="currentColor" stroke="none"/>
                    </svg>
                  </span>
                  <span class="taskbar-app taskbar-browser">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"/>
                      <ellipse cx="12" cy="12" rx="4" ry="9"/>
                      <path d="M3 12h18"/>
                    </svg>
                  </span>
                </div>
                <div class="system-tray">
                  <svg viewBox="0 0 24 24">
                    <path d="m8 14 4-4 4 4"/>
                  </svg>
                  <svg viewBox="0 0 24 24">
                    <path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 3a4.5 4.5 0 0 1 6 0"/>
                    <circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/>
                  </svg>
                  <svg viewBox="0 0 24 24">
                    <path d="M4 9h4l5-4v14l-5-4H4Zm12 0a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/>
                  </svg>
                  <span class="taskbar-clock">9:41 AM</span>
                </div>
              </div>
            </div>
          </div>
          <div class="monitor-stand" aria-hidden="true"></div>
          <div class="monitor-base" aria-hidden="true"></div>
        </div>
      </figure>
    </main>
  </div>
</body>
</html>
